media: media

content:
  - name: products
    label: Products & Affiliate Finds
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: id
        label: ID
        type: number
        readonly: true
      - name: name
        label: Product name
        type: string
        required: true
      - name: category
        label: Category
        type: select
        options:
          values:
            - name: fashion
              label: Fashion
            - name: beauty
              label: Beauty
            - name: home
              label: Home
            - name: gifts
              label: Gifts
            - name: lifestyle
              label: Lifestyle
        required: true
      - name: price
        label: Price
        type: string
      - name: description
        label: Short description
        type: text
      - name: image
        label: Product image URL
        type: string
      - name: affiliateUrl
        label: Legacy affiliate link
        type: string
        hidden: true
      - name: affiliateLinks
        label: Affiliate links (up to 4)
        type: object
        list:
          max: 4
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Button / store name
            type: string
          - name: url
            label: Affiliate URL
            type: string
      - name: buttonText
        label: Button text
        type: string
      - name: badge
        label: Badge
        type: string
      - name: tags
        label: Search tags
        type: string
        list: true

settings:
  content:
    merge: true
